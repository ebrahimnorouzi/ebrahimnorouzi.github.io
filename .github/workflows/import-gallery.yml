name: 🖼️ Import Gallery (Instagram export from Google Drive)

# Manual trigger only — run this after updating the Google Drive folder.
on:
  workflow_dispatch:

jobs:
  import-gallery:
    name: Download Instagram export & import into gallery
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install gdown pyyaml pillow requests

      # Required secret:
      #   GDRIVE_INSTAGRAM_EXPORT_URL — Google Drive shared-folder URL
      #   (folder must be shared with "Anyone with the link can view")
      - name: Import gallery from Google Drive
        env:
          GDRIVE_INSTAGRAM_EXPORT_URL: ${{ secrets.GDRIVE_INSTAGRAM_EXPORT_URL }}
        run: python scripts/import_gallery.py

      - name: Commit new gallery entries (if any)
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/gallery.yml images/gallery/ 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: auto-import new gallery images from Instagram export"
            git push origin HEAD:master
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No new images to import."
          fi

      - name: Trigger Deploy GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        run: gh workflow run pages.yml --ref master
        env:
          GH_TOKEN: ${{ github.token }}
