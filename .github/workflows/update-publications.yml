name: 🎓 Auto-update Publications (Semantic Scholar + arXiv + Zenodo)

# Runs on the 1st of every month at 08:00 UTC, or manually via "Run workflow"
on:
  schedule:
    - cron: '0 8 1 * *'
  workflow_dispatch:

jobs:
  update-publications:
    name: Fetch & commit new publications
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      # Secrets to set in Settings → Secrets and variables → Actions:
      #   S2_API_KEY       — Semantic Scholar API key (higher rate limits)
      #   S2_AUTHOR_ID     — your S2 author ID (skips auto-discovery API call)
      #   ZENODO_API_TOKEN — Zenodo personal access token (optional)
      - name: Fetch publications
        env:
          S2_API_KEY:       ${{ secrets.S2_API_KEY }}
          S2_AUTHOR_ID:     ${{ secrets.S2_AUTHOR_ID }}
          ARXIV_AUTHOR:     "Ebrahim Norouzi"
          ZENODO_AUTHOR:    "Norouzi, Ebrahim"
          ZENODO_API_TOKEN: ${{ secrets.ZENODO_API_TOKEN }}
        run: python scripts/update_publications.py

      - name: Commit new publications (if any)
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _publications/ scripts/.s2_author_id 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: auto-update publications from Semantic Scholar + arXiv + Zenodo"
            git push origin HEAD:master
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Deploy GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        run: gh workflow run pages.yml --ref master
        env:
          GH_TOKEN: ${{ github.token }}
