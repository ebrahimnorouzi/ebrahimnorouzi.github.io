name: 🎓 Auto-update Publications from Google Scholar

# Runs on the 1st of every month at 08:00 UTC, or manually via the Actions tab
on:
  schedule:
    - cron: '0 8 1 * *'
  workflow_dispatch:        # allows manual "Run workflow" button in GitHub UI

jobs:
  update-publications:
    name: Fetch & commit new publications
    runs-on: ubuntu-latest
    permissions:
      contents: write       # needed to push the updated markdown files

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install scholarly

      - name: Run publication updater
        run: python scripts/update_publications.py

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet _publications/ || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push new publications
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _publications/
          git commit -m "chore: auto-update publications from Google Scholar [skip ci]"
          git push
