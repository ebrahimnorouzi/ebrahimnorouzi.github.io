name: 📣 Auto-sync Social Posts (Mastodon)

# Runs on the 1st of every month at 09:00 UTC, or manually from the Actions tab
on:
  schedule:
    - cron: '0 9 1 * *'
  workflow_dispatch:

jobs:
  sync-posts:
    name: Fetch & commit new social posts
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Fetch social posts
        env:
          MASTODON_INSTANCE: sigmoid.social
          MASTODON_USERNAME: enorouzi
          MAX_POSTS: 20
          INCLUDE_BOOSTS: "true"
        run: python scripts/fetch_social_posts.py

      - name: Commit and push new posts
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _posts/
          if ! git diff --staged --quiet; then
            git commit -m "chore: auto-sync social posts from Mastodon"
            git push origin HEAD:master
          fi
