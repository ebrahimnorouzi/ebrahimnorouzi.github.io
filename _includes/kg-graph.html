<!-- Interactive Knowledge Graph — D3.js v7 -->
<div class="kg-hero" id="kg-hero-wrapper">
  <div class="kg-header">
    <span class="kg-header-label">Research Knowledge Graph</span>
    <div class="kg-legend">
      <span class="kg-leg" data-t="person">◉ Person</span>
      <span class="kg-leg" data-t="expertise">◉ Expertise</span>
      <span class="kg-leg" data-t="affiliation">◉ Affiliation</span>
      <span class="kg-leg" data-t="publication">◉ Publication</span>
    </div>
  </div>
  <svg id="kg-svg" role="img" aria-label="Knowledge graph of Ebrahim Norouzi's research network"></svg>
  <div id="kg-tooltip" class="kg-tooltip" role="tooltip"></div>
  <div class="kg-hint">🖱 Drag · Scroll to zoom · Click to navigate</div>
</div>

<script>
(function () {
  /* ── Data ─────────────────────────────────────────────────── */
  const COLORS = {
    person:      "#0c1f3f",
    expertise:   "#0fb8a0",
    affiliation: "#5b6cf9",
    publication: "#f59e0b",
  };

  const nodes = [
    // Person
    { id:"en",   label:"Ebrahim\nNorouzi",       type:"person",      r:26, url:"/" },
    // Expertise
    { id:"kg",   label:"Knowledge\nGraphs",       type:"expertise",   r:16, url:"/publications/" },
    { id:"llm",  label:"LLMs",                    type:"expertise",   r:15, url:"/publications/" },
    { id:"mat",  label:"Materials\nInformatics",  type:"expertise",   r:14, url:"/publications/" },
    { id:"sw",   label:"Semantic\nWeb",           type:"expertise",   r:13, url:"/publications/" },
    { id:"onto", label:"Ontology\nEngineering",   type:"expertise",   r:13, url:"/publications/" },
    { id:"ie",   label:"Info.\nExtraction",       type:"expertise",   r:11, url:"/publications/" },
    // Affiliations
    { id:"fiz",  label:"FIZ\nKarlsruhe",         type:"affiliation", r:14, url:"https://www.fiz-karlsruhe.de" },
    { id:"kit",  label:"KIT AIFB",               type:"affiliation", r:13, url:"https://ise.aifb.kit.edu" },
    { id:"iwm",  label:"Fraunhofer\nIWM",        type:"affiliation", r:11, url:"https://www.iwm.fraunhofer.de" },
    { id:"mpie", label:"Max Planck\nInst.",      type:"affiliation", r:9,  url:"https://www.mpie.de" },
    { id:"rub",  label:"RUB\nICAMS",             type:"affiliation", r:9,  url:"https://www.icams.de" },
    // Publications
    { id:"p1",   label:"ConExion",               type:"publication", r:9,  url:"/publication/conexion-concept-extraction-with-large-language-mod/" },
    { id:"p2",   label:"Ontology\nLandscape",    type:"publication", r:9,  url:"/publication/the-landscape-of-ontologies-in-materials-science-and/" },
    { id:"p3",   label:"KGMistral",              type:"publication", r:8,  url:"/publication/kgmistral-towards-boosting-the-performance-of-large-l/" },
    { id:"p4",   label:"OAEI ML\nDataset",       type:"publication", r:8,  url:"/publication/oaei-machine-learning-dataset-for-online-model-generat/" },
    { id:"p5",   label:"KG-based\nRDM",          type:"publication", r:8,  url:"/publication/knowledge-graph-based-rdm-solutions-nfdi4culture-nfdi-/" },
    { id:"p6",   label:"Entity\nAlignment",      type:"publication", r:8,  url:"/publication/enhancing-entity-alignment-between-wikidata-and-artgra/" },
    { id:"p7",   label:"Metallic\nGlass",        type:"publication", r:7,  url:"/publication/in-situ-correlation-between-metastable-phase-transforma/" },
    { id:"p8",   label:"Parameter\nID",          type:"publication", r:7,  url:"/publication/data-driven-accelerated-parameter-identification-for-c/" },
  ];

  const links = [
    // Person → Expertise
    { s:"en", t:"kg",   w:2.5 }, { s:"en", t:"llm",  w:2.5 },
    { s:"en", t:"mat",  w:2.2 }, { s:"en", t:"sw",   w:2.0 },
    { s:"en", t:"onto", w:2.0 }, { s:"en", t:"ie",   w:1.8 },
    // Person → Affiliations
    { s:"en", t:"fiz",  w:2.8 }, { s:"en", t:"kit",  w:2.8 },
    { s:"en", t:"iwm",  w:1.8 }, { s:"en", t:"mpie", w:1.4 },
    { s:"en", t:"rub",  w:1.4 },
    // Publications → Expertise
    { s:"p1", t:"llm",  w:1.4 }, { s:"p1", t:"ie",   w:1.6 }, { s:"p1", t:"onto", w:1.2 },
    { s:"p2", t:"onto", w:1.6 }, { s:"p2", t:"mat",  w:1.4 }, { s:"p2", t:"sw",   w:1.2 },
    { s:"p3", t:"kg",   w:1.4 }, { s:"p3", t:"llm",  w:1.6 }, { s:"p3", t:"mat",  w:1.0 },
    { s:"p4", t:"kg",   w:1.4 }, { s:"p4", t:"onto", w:1.2 },
    { s:"p5", t:"kg",   w:1.6 }, { s:"p5", t:"sw",   w:1.2 },
    { s:"p6", t:"kg",   w:1.4 }, { s:"p6", t:"llm",  w:1.0 },
    { s:"p7", t:"mat",  w:1.6 }, { s:"p8", t:"mat",  w:1.6 },
  ].map(l => ({ source: l.s, target: l.t, w: l.w }));

  /* ── Wait for D3 then build ───────────────────────────────── */
  function buildGraph() {
    if (typeof d3 === "undefined") { setTimeout(buildGraph, 120); return; }

    const wrap   = document.getElementById("kg-hero-wrapper");
    const svg    = d3.select("#kg-svg");
    const tip    = document.getElementById("kg-tooltip");

    function dims() {
      return { w: wrap.clientWidth || 800, h: 440 };
    }

    let { w, h } = dims();
    svg.attr("width", w).attr("height", h);

    /* ── SVG defs (filters + arrowhead) ── */
    const defs = svg.append("defs");

    // Glow filter per node type
    Object.entries(COLORS).forEach(([type, color]) => {
      const f = defs.append("filter").attr("id", `glow-${type}`).attr("x", "-50%").attr("y", "-50%").attr("width", "200%").attr("height", "200%");
      f.append("feGaussianBlur").attr("in", "SourceGraphic").attr("stdDeviation", type === "person" ? 6 : 4).attr("result", "blur");
      const merge = f.append("feMerge");
      merge.append("feMergeNode").attr("in", "blur");
      merge.append("feMergeNode").attr("in", "SourceGraphic");
    });

    // Arrowhead marker
    defs.append("marker")
      .attr("id", "arrow").attr("viewBox", "0 -4 8 8").attr("refX", 8).attr("refY", 0)
      .attr("markerWidth", 5).attr("markerHeight", 5).attr("orient", "auto")
      .append("path").attr("d", "M0,-4L8,0L0,4").attr("fill", "rgba(15,184,160,0.5)");

    /* ── Background ── */
    svg.append("rect").attr("width", w).attr("height", h).attr("fill", "#080e1f");

    // Dot-grid
    const dotSpacing = 28;
    const dotG = svg.append("g").attr("class", "dot-grid");
    for (let x = dotSpacing; x < w; x += dotSpacing) {
      for (let y = dotSpacing; y < h; y += dotSpacing) {
        dotG.append("circle").attr("cx", x).attr("cy", y).attr("r", 0.9).attr("fill", "rgba(255,255,255,0.07)");
      }
    }

    /* ── Main group (zoom target) ── */
    const g = svg.append("g").attr("class", "kg-main");

    /* ── Zoom ── */
    svg.call(d3.zoom().scaleExtent([0.35, 3]).on("zoom", e => g.attr("transform", e.transform)));

    /* ── Simulation ── */
    const sim = d3.forceSimulation(nodes)
      .force("link", d3.forceLink(links).id(d => d.id).distance(d => {
        const src = typeof d.source === "object" ? d.source : nodes.find(n => n.id === d.source);
        const tgt = typeof d.target === "object" ? d.target : nodes.find(n => n.id === d.target);
        if (!src || !tgt) return 90;
        const combined = src.r + tgt.r;
        return combined * 4.0;
      }).strength(0.4))
      .force("charge", d3.forceManyBody().strength(d => -Math.pow(d.r, 2) * 4.5))
      .force("center", d3.forceCenter(w / 2, h / 2))
      .force("collide", d3.forceCollide(d => d.r + 18).strength(0.9))
      .alphaDecay(0.025);

    /* ── Edges ── */
    const link = g.append("g").attr("class", "links")
      .selectAll("line")
      .data(links).enter()
      .append("line")
      .attr("stroke", "rgba(15,184,160,0.28)")
      .attr("stroke-width", d => d.w || 1)
      .attr("stroke-linecap", "round")
      .attr("marker-end", "url(#arrow)");

    /* ── Nodes ── */
    const node = g.append("g").attr("class", "nodes")
      .selectAll("g")
      .data(nodes).enter()
      .append("g")
      .attr("class", d => `node-group node-${d.type}`)
      .style("cursor", d => d.url ? "pointer" : "default")
      .call(d3.drag()
        .on("start", (e, d) => { if (!e.active) sim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
        .on("drag",  (e, d) => { d.fx = e.x; d.fy = e.y; })
        .on("end",   (e, d) => { if (!e.active) sim.alphaTarget(0); d.fx = null; d.fy = null; })
      );

    // Outer glow ring
    node.append("circle")
      .attr("r", d => d.r + 6)
      .attr("fill", "none")
      .attr("stroke", d => COLORS[d.type])
      .attr("stroke-width", 1)
      .attr("stroke-opacity", 0.2)
      .attr("class", "node-ring");

    // Main circle
    node.append("circle")
      .attr("r", d => d.r)
      .attr("fill", d => d.type === "person" ? COLORS[d.type] : "rgba(8,14,31,0.85)")
      .attr("stroke", d => COLORS[d.type])
      .attr("stroke-width", d => d.type === "person" ? 3 : 2)
      .attr("filter", d => `url(#glow-${d.type})`);

    // Multi-line label
    node.each(function(d) {
      const grp = d3.select(this);
      const lines = d.label.split("\n");
      const lineH = 11;
      const totalH = lines.length * lineH;
      lines.forEach((line, i) => {
        grp.append("text")
          .attr("text-anchor", "middle")
          .attr("dy", -totalH / 2 + i * lineH + 4 + "px")
          .attr("fill", d.type === "person" ? "#ffffff" : COLORS[d.type])
          .attr("font-size", d.type === "person" ? "9.5px" : "8px")
          .attr("font-family", "'Space Grotesk','Inter',sans-serif")
          .attr("font-weight", "700")
          .attr("letter-spacing", "0.02em")
          .attr("pointer-events", "none")
          .text(line);
      });
    });

    /* ── Interaction ── */
    node
      .on("mouseenter", function(e, d) {
        const relIds = new Set([d.id]);
        link.each(l => {
          const sId = typeof l.source === "object" ? l.source.id : l.source;
          const tId = typeof l.target === "object" ? l.target.id : l.target;
          if (sId === d.id) relIds.add(tId);
          if (tId === d.id) relIds.add(sId);
        });
        node.selectAll("circle").attr("opacity", nd => relIds.has(nd.id) ? 1 : 0.2);
        node.selectAll("text").attr("opacity", nd => relIds.has(nd.id) ? 1 : 0.15);
        link.attr("stroke-opacity", l => {
          const sId = typeof l.source === "object" ? l.source.id : l.source;
          const tId = typeof l.target === "object" ? l.target.id : l.target;
          return (sId === d.id || tId === d.id) ? 0.85 : 0.05;
        }).attr("stroke", l => {
          const sId = typeof l.source === "object" ? l.source.id : l.source;
          const tId = typeof l.target === "object" ? l.target.id : l.target;
          return (sId === d.id || tId === d.id) ? "#0fb8a0" : "rgba(15,184,160,0.28)";
        });

        const label = d.label.replace("\n", " ");
        tip.innerHTML = `<strong>${label}</strong><br><span class="kg-tip-type">${d.type}</span>${d.url ? '<br><span class="kg-tip-cta">Click to visit →</span>' : ''}`;
        tip.style.opacity = "1";
      })
      .on("mousemove", function(e) {
        const rect = wrap.getBoundingClientRect();
        tip.style.left = (e.clientX - rect.left + 12) + "px";
        tip.style.top  = (e.clientY - rect.top  - 10) + "px";
      })
      .on("mouseleave", function() {
        node.selectAll("circle").attr("opacity", 1);
        node.selectAll("text").attr("opacity", 1);
        link.attr("stroke-opacity", 0.28).attr("stroke", "rgba(15,184,160,0.28)");
        tip.style.opacity = "0";
      })
      .on("click", (e, d) => {
        if (!d.url) return;
        if (d.url.startsWith("http")) window.open(d.url, "_blank");
        else window.location.href = d.url;
      });

    /* ── Tick ── */
    sim.on("tick", () => {
      link
        .attr("x1", d => d.source.x).attr("y1", d => d.source.y)
        .attr("x2", d => {
          const dx = d.target.x - d.source.x, dy = d.target.y - d.source.y;
          const dist = Math.sqrt(dx * dx + dy * dy) || 1;
          return d.target.x - (dx / dist) * (d.target.r + 10);
        })
        .attr("y2", d => {
          const dx = d.target.x - d.source.x, dy = d.target.y - d.source.y;
          const dist = Math.sqrt(dx * dx + dy * dy) || 1;
          return d.target.y - (dy / dist) * (d.target.r + 10);
        });
      node.attr("transform", d => `translate(${d.x},${d.y})`);
    });

    /* ── Pulse animation on person node ── */
    (function pulse() {
      const pNode = g.select(".node-person .node-ring");
      pNode.transition().duration(1400).attr("stroke-opacity", 0.6).attr("r", d => d.r + 10)
        .transition().duration(1400).attr("stroke-opacity", 0.15).attr("r", d => d.r + 6)
        .on("end", pulse);
    })();

    /* ── Resize ── */
    window.addEventListener("resize", () => {
      const d = dims();
      svg.attr("width", d.w).attr("height", d.h);
      svg.select("rect").attr("width", d.w).attr("height", d.h);
      sim.force("center", d3.forceCenter(d.w / 2, d.h / 2)).alpha(0.3).restart();
    });
  }

  /* ── Load D3 from CDN then build ───────────────────────────── */
  if (document.getElementById("d3-script")) { buildGraph(); return; }
  const s = document.createElement("script");
  s.id  = "d3-script";
  s.src = "https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js";
  s.onload = buildGraph;
  document.head.appendChild(s);
})();
</script>
